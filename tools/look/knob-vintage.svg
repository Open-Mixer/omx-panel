<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- The vintage look's knob, ONE drawing, in the console's own metal: the console's Encoder's cap (a radial cap-hi to face gradient, a rim in
       the edge colour, a knurled edge, a carved pointer between a shaded and a lit groove wall) and its silkscreened tick ring. Every
       colour is a pinned-token placeholder: the console's pinned tokens (tools/look-pin.mjs) in the look's finish,
       aluminium by default, never retyped. {angle} is the frame's, from -135 to +135 degrees. tools/svg-knob.mjs reads the subset. -->
  <defs>
    <radialGradient id="cap" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="{finish:--knob-cap-hi}"/>
      <stop offset="1" stop-color="{finish:--knob-face}"/>
    </radialGradient>
  </defs>
  <g transform="rotate(-135 24 24)"><line x1="24" y1="0.8" x2="24" y2="3.4" stroke="{console:--legend}" stroke-opacity="0.7" stroke-width="0.9"/></g>
  <g transform="rotate(-108 24 24)"><line x1="24" y1="0.8" x2="24" y2="3.4" stroke="{console:--legend}" stroke-opacity="0.7" stroke-width="0.9"/></g>
  <g transform="rotate(-81 24 24)"><line x1="24" y1="0.8" x2="24" y2="3.4" stroke="{console:--legend}" stroke-opacity="0.7" stroke-width="0.9"/></g>
  <g transform="rotate(-54 24 24)"><line x1="24" y1="0.8" x2="24" y2="3.4" stroke="{console:--legend}" stroke-opacity="0.7" stroke-width="0.9"/></g>
  <g transform="rotate(-27 24 24)"><line x1="24" y1="0.8" x2="24" y2="3.4" stroke="{console:--legend}" stroke-opacity="0.7" stroke-width="0.9"/></g>
  <g transform="rotate(0 24 24)"><line x1="24" y1="0.8" x2="24" y2="3.4" stroke="{console:--legend}" stroke-opacity="0.7" stroke-width="0.9"/></g>
  <g transform="rotate(27 24 24)"><line x1="24" y1="0.8" x2="24" y2="3.4" stroke="{console:--legend}" stroke-opacity="0.7" stroke-width="0.9"/></g>
  <g transform="rotate(54 24 24)"><line x1="24" y1="0.8" x2="24" y2="3.4" stroke="{console:--legend}" stroke-opacity="0.7" stroke-width="0.9"/></g>
  <g transform="rotate(81 24 24)"><line x1="24" y1="0.8" x2="24" y2="3.4" stroke="{console:--legend}" stroke-opacity="0.7" stroke-width="0.9"/></g>
  <g transform="rotate(108 24 24)"><line x1="24" y1="0.8" x2="24" y2="3.4" stroke="{console:--legend}" stroke-opacity="0.7" stroke-width="0.9"/></g>
  <g transform="rotate(135 24 24)"><line x1="24" y1="0.8" x2="24" y2="3.4" stroke="{console:--legend}" stroke-opacity="0.7" stroke-width="0.9"/></g>
  <circle cx="24" cy="25" r="19.6" fill="{console:--shade}" fill-opacity="0.5"/>
  <circle cx="24" cy="24" r="19.4" fill="{finish:--knob-edge}"/>
  <circle cx="24" cy="24" r="17.6" fill="{finish:--knob-knurl}"/>
  <g transform="rotate(0 24 24)"><line x1="24" y1="4.9" x2="24" y2="6.5" stroke="{finish:--knob-knurl}" stroke-width="0.7"/></g>
  <g transform="rotate(15 24 24)"><line x1="24" y1="4.9" x2="24" y2="6.5" stroke="{finish:--knob-knurl}" stroke-width="0.7"/></g>
  <g transform="rotate(30 24 24)"><line x1="24" y1="4.9" x2="24" y2="6.5" stroke="{finish:--knob-knurl}" stroke-width="0.7"/></g>
  <g transform="rotate(45 24 24)"><line x1="24" y1="4.9" x2="24" y2="6.5" stroke="{finish:--knob-knurl}" stroke-width="0.7"/></g>
  <g transform="rotate(60 24 24)"><line x1="24" y1="4.9" x2="24" y2="6.5" stroke="{finish:--knob-knurl}" stroke-width="0.7"/></g>
  <g transform="rotate(75 24 24)"><line x1="24" y1="4.9" x2="24" y2="6.5" stroke="{finish:--knob-knurl}" stroke-width="0.7"/></g>
  <g transform="rotate(90 24 24)"><line x1="24" y1="4.9" x2="24" y2="6.5" stroke="{finish:--knob-knurl}" stroke-width="0.7"/></g>
  <g transform="rotate(105 24 24)"><line x1="24" y1="4.9" x2="24" y2="6.5" stroke="{finish:--knob-knurl}" stroke-width="0.7"/></g>
  <g transform="rotate(120 24 24)"><line x1="24" y1="4.9" x2="24" y2="6.5" stroke="{finish:--knob-knurl}" stroke-width="0.7"/></g>
  <g transform="rotate(135 24 24)"><line x1="24" y1="4.9" x2="24" y2="6.5" stroke="{finish:--knob-knurl}" stroke-width="0.7"/></g>
  <g transform="rotate(150 24 24)"><line x1="24" y1="4.9" x2="24" y2="6.5" stroke="{finish:--knob-knurl}" stroke-width="0.7"/></g>
  <g transform="rotate(165 24 24)"><line x1="24" y1="4.9" x2="24" y2="6.5" stroke="{finish:--knob-knurl}" stroke-width="0.7"/></g>
  <g transform="rotate(180 24 24)"><line x1="24" y1="4.9" x2="24" y2="6.5" stroke="{finish:--knob-knurl}" stroke-width="0.7"/></g>
  <g transform="rotate(195 24 24)"><line x1="24" y1="4.9" x2="24" y2="6.5" stroke="{finish:--knob-knurl}" stroke-width="0.7"/></g>
  <g transform="rotate(210 24 24)"><line x1="24" y1="4.9" x2="24" y2="6.5" stroke="{finish:--knob-knurl}" stroke-width="0.7"/></g>
  <g transform="rotate(225 24 24)"><line x1="24" y1="4.9" x2="24" y2="6.5" stroke="{finish:--knob-knurl}" stroke-width="0.7"/></g>
  <g transform="rotate(240 24 24)"><line x1="24" y1="4.9" x2="24" y2="6.5" stroke="{finish:--knob-knurl}" stroke-width="0.7"/></g>
  <g transform="rotate(255 24 24)"><line x1="24" y1="4.9" x2="24" y2="6.5" stroke="{finish:--knob-knurl}" stroke-width="0.7"/></g>
  <g transform="rotate(270 24 24)"><line x1="24" y1="4.9" x2="24" y2="6.5" stroke="{finish:--knob-knurl}" stroke-width="0.7"/></g>
  <g transform="rotate(285 24 24)"><line x1="24" y1="4.9" x2="24" y2="6.5" stroke="{finish:--knob-knurl}" stroke-width="0.7"/></g>
  <g transform="rotate(300 24 24)"><line x1="24" y1="4.9" x2="24" y2="6.5" stroke="{finish:--knob-knurl}" stroke-width="0.7"/></g>
  <g transform="rotate(315 24 24)"><line x1="24" y1="4.9" x2="24" y2="6.5" stroke="{finish:--knob-knurl}" stroke-width="0.7"/></g>
  <g transform="rotate(330 24 24)"><line x1="24" y1="4.9" x2="24" y2="6.5" stroke="{finish:--knob-knurl}" stroke-width="0.7"/></g>
  <g transform="rotate(345 24 24)"><line x1="24" y1="4.9" x2="24" y2="6.5" stroke="{finish:--knob-knurl}" stroke-width="0.7"/></g>
  <circle cx="24" cy="24" r="16.9" fill="url(#cap)"/>
  <g transform="rotate({angle} 24 24)">
    <line x1="22.7" y1="9" x2="22.7" y2="19" stroke="{finish:--knob-knurl}" stroke-opacity="0.8" stroke-width="1.2"/>
    <line x1="25.3" y1="9" x2="25.3" y2="19" stroke="{finish:--knob-cap-hi}" stroke-opacity="0.6" stroke-width="1.2"/>
    <line x1="24" y1="9" x2="24" y2="19" stroke="{console:--knob-pointer}" stroke-width="2.4"/>
  </g>
</svg>
