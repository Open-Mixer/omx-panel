# After each successful plugin-qualify sync, queue the omx-panel sync pass when its unit is enabled (the default where
# systemd exists; `systemctl disable omx-panel-sync` stops it). Queued by the finish of the sync rather than a Wants=
# resolved when its start job is enqueued, so two scans in a row each get their pass. A disabled unit is no failure:
# the step exits 0 and starts nothing (plugin-qualify#56). The leading '-' keeps a missing systemctl or a start that
# fails from failing the scan. If a scan finishes while a pass is still running, this start is a no-op until the next.
[Service]
ExecStartPost=-/bin/sh -c 'if systemctl is-enabled -q omx-panel-sync.service; then systemctl start --no-block omx-panel-sync.service; fi'
