# After each successful plugin-qualify sync, queue the GUI sync, but only if it was enabled
# (`systemctl enable omx-modgui-sync` is the opt-in; the package never makes it). Queued by the finish of the sync
# rather than a Wants= resolved when its start job is enqueued, so two scans in a row each get their GUI run.
# A disabled unit is no failure: the step exits 0 and starts nothing (plugin-qualify#56). The leading '-' keeps a
# missing systemctl or a start that fails from failing the scan. If a scan finishes while a GUI
# run is still running, this start is a no-op until the next scan.
[Service]
ExecStartPost=-/bin/sh -c 'if systemctl is-enabled -q omx-modgui-sync.service; then systemctl start --no-block omx-modgui-sync.service; fi'
