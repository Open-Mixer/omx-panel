name: release

# A version tag v<package.json version> proves the package (tests, checks), builds omx-panel (RPM and DEB)
# through Open-Mixer/.github's shared workflows, attaches them and the `npm pack` tarball to the
# GitHub release. The npm package is published by publish.yml (npmjs.com trusts that file by name, with no
# environment), on the same tag.

# A manual run with staged on (never a tag) builds fc45 x86_64 and trixie amd64 only, against the staging channel, and
# publishes them, signed, to the staging channel (staging/rpm and staging/deb of the channel repository), where the
# next layer of the release chain finds them by adding the staging channel beside the real one. Nothing reaches the
# real channel, and the real release still publishes once from the v<version> tag (Open-Mixer/.github build-rpm.yml
# and build-deb.yml).

on:
  push:
    tags: ['v*']
    # a merge to devel builds the real package and publishes it to staging (Open-Mixer/.github#289)
    branches: [devel]
  workflow_dispatch:
    inputs:
      republish:
        description: 'finish a partial publish of a version the channel already serves'
        type: boolean
        default: false
      staged:
        description: 'Build fc45 x86_64 and trixie amd64 only and publish them to the staging channel for the next layer; publishes nothing to the real channel'
        type: boolean
        default: false
      same_pass:
        description: 'Packages other repositories release later in the same pass, space separated; empty reads .github/release-same-pass at the commit built'
        type: string
        default: ''

# A called workflow cannot exceed its caller's token. build-rpm.yml and build-deb.yml run a report-failure job that
# asks for `issues: write` and `actions: read`; without both here GitHub refuses to start the run at all.
permissions:
  contents: write
  issues: write
  actions: read

jobs:
  # The packages other repositories release LATER in this same pass, for the channel-installability gate's same-pass
  # (a breakage they cause or suffer is reported, not red): a dispatch's same_pass input, else the tracked
  # .github/release-same-pass at the very commit this run builds (the tag on a push), one package per line, # comments
  # allowed. The file is reviewed like code, lives on its release branch and goes with it; never a repository variable,
  # which is mutable, unversioned and can outlive its pass to excuse a later break.
  samepass:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-same-pass
          sparse-checkout-cone-mode: false
      - id: read
        run: |
          f=.github/release-same-pass
          [ -f "$f" ] || { echo "list=" >>"$GITHUB_OUTPUT"; echo "no $f at this commit: nothing released in the same pass"; exit 0; }
          names=$(sed -e 's/#.*//' "$f" | tr -s ' \t\r\n' '\n' | sed '/^$/d')
          for n in $names; do
            [[ "$n" =~ ^[a-z0-9][a-z0-9.+-]*$ ]] || { echo "::error::$f: '$n' is not a package name"; exit 1; }
          done
          list=$(echo $names)
          echo "list=$list" >>"$GITHUB_OUTPUT"
          echo "same pass from $f: ${list:-none}"

  check:
    name: Prove the release
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.OMX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    container:
      image: fedora:45
    steps:
      - name: Install node
        run: |
          dnf install -y --setopt=install_weak_deps=False git make nodejs npm dnf5-plugins python3-lilv lilv-devel
      - name: Add the OpenMixer repository
        uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1
        with:
          # a devel push stages its build, so its proof reads the staging channel, as build-rpm.yml's jobs do
          staging: ${{ inputs.staged == true || (github.event_name == 'push' && github.ref == 'refs/heads/devel') }}
          # a pull request into devel, or a dispatch off main, in a wave reads that wave's devel channel above staging (Open-Mixer/.github#329)
          devel-channel: ${{ ((startsWith(github.event_name, 'pull_request') && github.base_ref == 'devel') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && vars.OMX_DEVEL_CHANNEL || '' }}

      - name: Install the vocabulary the suite reads
        run: |
          dnf install -y --setopt=install_weak_deps=False omx-contract-data plugin-db-contract omx-dsp-wasm
          # the panel domain's checks, as in ci.yml: omx-contract (validate, fmt), its domain installer (omx-contract-devel)
          # and the C loader's omx-domain command (libomx-domain-devel), at the floor the data package names
          dnf install -y --setopt=install_weak_deps=False omx-contract omx-contract-devel libomx-domain-devel
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: The checkout is a git directory this job may read
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install the real MOD bundles the importer proof reads
        # caps-lv2 (Audinux) carries mod-caps-CEO.lv2 and the other caps modguis: the importer's proof on a real
        # bundle reads them where they are installed, and no MOD file is copied into this tree.
        run: |
          dnf copr enable -y ycollet/audinux
          dnf install -y --setopt=install_weak_deps=False caps-lv2
      # npm ci installs the build's tools; the twins the cases read (omx-dsp's curve, omx-contract) are then linked to the
      # channel's packages, not the registry's: a devel run's are staged and not on npm (npm publishes from a tag only)
      - run: npm ci
      - run: make link-packaged PREFIX=/usr DATADIR=/usr/share
      # the shape renders' tests (test/shapes.test.mjs) run their generators under CI, so the proof has them as ci.yml does:
      # omx-contract's tree at ci.yml's pin (OMX_CONTRACT_SHAPES_REF there; both move together) and the pinned venv
      - name: The shape generators (docs/shapes.md), at omx-contract's pins
        env:
          OMX_CONTRACT_SHAPES_REF: 608ce65cb73aa9d7fe0ed4a39363c237200305f1
        run: |
          set -euo pipefail
          dnf install -y --setopt=install_weak_deps=False python3-pip
          tree="$RUNNER_TEMP/omx-contract-shapes"
          git init -q "$tree"
          git -C "$tree" fetch -q --depth 1 https://github.com/Open-Mixer/omx-contract.git "$OMX_CONTRACT_SHAPES_REF"
          git -C "$tree" checkout -q FETCH_HEAD
          (cd "$tree" && npm ci --no-audit --no-fund)
          python3 -m venv "$RUNNER_TEMP/shapes-venv"
          "$RUNNER_TEMP/shapes-venv/bin/pip" install -q -r "$tree/tools/shapes-requirements.txt"
          echo "OMX_CONTRACT_TREE=$tree" >> "$GITHUB_ENV"
          echo "OMX_DATAMODEL_CODEGEN=$RUNNER_TEMP/shapes-venv/bin/datamodel-codegen" >> "$GITHUB_ENV"
      - name: The tag names the package version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="v$(node -p 'require("./package.json").version')"
          [ "$TAG" = "$want" ] || { echo "::error::tag $TAG is not $want (package.json)"; exit 1; }
      - name: npm test, the lilv proofs required (python3-lilv is installed above)
        env:
          OMX_PANEL_LILV: required
          # the importer's proof on the installed caps bundles runs here, or the job fails: no skip for a missing bundle
          OMX_PANEL_REAL_BUNDLES: required
          # the panel domain is formatted and validated here by the installed omx-contract CLI, or the job fails
          OMX_CONTRACT_CLI: /usr/lib/omx-contract/bin/omx-contract.mjs
        run: npm test
      - name: The shared private-refs and SPDX checks, outside the checkout they scan (at v1)
        run: |
          git clone -q https://github.com/Open-Mixer/.github "$RUNNER_TEMP/openmixer-dotgithub"
          git -c advice.detachedHead=false -C "$RUNNER_TEMP/openmixer-dotgithub" checkout -q openmixer-v1
      - run: make check OPENMIXER_DOTGITHUB="$RUNNER_TEMP/openmixer-dotgithub"
        env:
          # the private-refs check reads this repository's visibility and topics from GitHub before it judges the tree
          GH_TOKEN: ${{ github.token }}
      - name: The bump covers every change since the previous tag
        run: |
          prev=$(git tag --list 'v*' --sort=-v:refname --merged HEAD | grep -vx "v$(node -p 'require("./package.json").version')" | head -1)
          if [ -n "$prev" ]; then echo "previous release $prev: the version is $(node -p 'require("./package.json").version')"; else echo "first release: no previous tag"; fi

  rpm:
    needs: [check, samepass]
    uses: Open-Mixer/.github/.github/workflows/build-rpm.yml@openmixer-v1
    with:
      same-pass: ${{ inputs.same_pass || needs.samepass.outputs.list }}
      staged: ${{ inputs.staged == true }}
      package-name: omx-panel
      # omx-panel, the renderer's shared library with its development files, the descriptions store (its library and
      # command, and its development files) and the panel domain (each installed by the install checks)
      binary-names: omx-panel omx-panel-render omx-panel-render-devel omx-panel-store omx-panel-store-devel omx-panel-descriptions omx-panel-contract
      publish: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
      republish: ${{ inputs.republish == true }}
      needs-mod-host: false
      # omx-contract-data and plugin-db-contract, which %check reads,
      # come from the channel
      channel-deps: true
    secrets: inherit

  # beside the RPMs: the two publish jobs share one concurrency group, so their pushes never race
  deb:
    needs: [check, samepass]
    uses: Open-Mixer/.github/.github/workflows/build-deb.yml@openmixer-v1
    with:
      same-pass: ${{ inputs.same_pass || needs.samepass.outputs.list }}
      staged: ${{ inputs.staged == true }}
      package-name: omx-panel
      binary-names: omx-panel libomx-panel-render1 libomx-panel-render-dev libomx-panel-store0 libomx-panel-store-dev omx-panel-store omx-panel-descriptions omx-panel-contract
      publish: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
      republish: ${{ inputs.republish == true }}
      dependencies: ''
      requires: ''
      # omx-contract-data and plugin-db-contract, which the tests read,
      # come from the channel
      channel-deps: true
    secrets: inherit

  pack:
    name: npm pack
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Pack the tarball the registry and the release both carry
        run: |
          mkdir -p pack
          npm pack --pack-destination pack
          tools/vendored-source.sh pack
          ls -l pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm-pack
          path: |
            pack/*.tgz
            pack/*-vendored.tar.gz
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/')) && 30 || 2 }}

  attach:
    name: Attach the npm tarball to the GitHub release
    needs: [pack, deb]
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.pack.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The release notes are the git history since the previous tag: no changelog file is kept (2026-10-09).
      - env:
          TAG: ${{ github.ref_name }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2>/dev/null || true)
          { echo "Changes in $TAG${prev:+ since $prev}:"; echo; git log --no-merges --format='- %s' "${prev:+$prev..}$TAG"; } > "$RUNNER_TEMP/release-notes.md"
      - uses: actions/download-artifact@v4
        with:
          name: npm-pack
          path: pack
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" pack/*.tgz pack/*-vendored.tar.gz --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" pack/*.tgz pack/*-vendored.tar.gz --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --repo "$GITHUB_REPOSITORY"
          fi
