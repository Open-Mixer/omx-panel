name: release

# A version tag v<package.json version> proves the package (tests, checks), builds omx-panel (RPM and DEB)
# through Open-Mixer/.github's shared workflows, attaches them and the `npm pack` tarball to the
# GitHub release. The npm package is published by publish.yml (npmjs.com trusts that file by name, with no
# environment), on the same tag.

# A manual run with staged on (never a tag) builds fc44 x86_64 and trixie amd64 only, against the staging channel, and
# publishes them, signed, to the staging channel (staging/rpm and staging/deb of the channel repository), where the
# next layer of the release chain finds them by adding the staging channel beside the real one. Nothing reaches the
# real channel, and the real release still publishes once from the v<version> tag (Open-Mixer/.github build-rpm.yml
# and build-deb.yml).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Sign and publish the packages; only a run on a tag publishes'
        type: boolean
        default: false
      republish:
        description: 'finish a partial publish of a version the channel already serves'
        type: boolean
        default: false
      staged:
        description: 'Build fc44 x86_64 and trixie amd64 only and publish them to the staging channel for the next layer; publishes nothing to the real channel'
        type: boolean
        default: false
      staged-deps:
        description: 'Ignored by the shared workflows, kept for this wave only'
        type: string
        default: ''

# A called workflow cannot exceed its caller's token. build-rpm.yml and build-deb.yml run a report-failure job that
# asks for `issues: write` and `actions: read`; without both here GitHub refuses to start the run at all.
permissions:
  contents: write
  issues: write
  actions: read

jobs:
  # the Fedora cells the release proof runs: check-matrix's answer (rule 11-10: fc45 beside fc44;
  # the quick set while a release wave is open, the whole matrix declared here otherwise)
  checks:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.OMX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      rpm: ${{ steps.m.outputs.rpm }}
      rpm-count: ${{ steps.m.outputs.rpm-count }}
    steps:
      - id: m
        uses: Open-Mixer/.github/.github/actions/check-matrix@openmixer-v1
        with:
          wave: ${{ vars.OMX_RELEASE_MATRIX }}
          rpm-releases: '["44", "45"]'
          rpm-arches: '["x86_64"]'

  check:
    needs: checks
    if: needs.checks.outputs.rpm-count != '0'
    name: Prove the release (${{ matrix.cell.image }})
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.OMX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.checks.outputs.rpm) }}
    container:
      image: ${{ matrix.cell.image }}
    steps:
      - name: Install node
        run: |
          dnf install -y --setopt=install_weak_deps=False git make nodejs npm dnf5-plugins python3-lilv lilv-devel
      - name: Add the OpenMixer repository
        uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1
        with:
          staging: ${{ inputs.staged == true }}

      - name: Install the vocabulary the suite reads
        run: |
          dnf install -y --setopt=install_weak_deps=False 'omx-contract-data >= 3.13.0' 'omx-contract-data < 4' 'plugin-hostd-contract >= 0.20.3' 'plugin-hostd-contract < 0.21'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: The checkout is a git directory this job may read
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - name: The tag names the package version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="v$(node -p 'require("./package.json").version')"
          [ "$TAG" = "$want" ] || { echo "::error::tag $TAG is not $want (package.json)"; exit 1; }
      - name: npm test, the lilv proofs required (python3-lilv is installed above)
        env:
          OMX_PANEL_LILV: required
        run: npm test
      - name: The shared private-refs and SPDX checks, outside the checkout they scan (at v1)
        run: |
          git clone -q https://github.com/Open-Mixer/.github "$RUNNER_TEMP/freemixer-dotgithub"
          git -c advice.detachedHead=false -C "$RUNNER_TEMP/freemixer-dotgithub" checkout -q v1
      - run: make check FREEMIXER_DOTGITHUB="$RUNNER_TEMP/freemixer-dotgithub"
      - name: The bump covers every change since the previous tag
        run: |
          prev=$(git tag --list 'v*' --sort=-v:refname --merged HEAD | grep -vx "v$(node -p 'require("./package.json").version')" | head -1)
          if [ -n "$prev" ]; then echo "previous release $prev: the version is $(node -p 'require("./package.json").version')"; else echo "first release: no previous tag"; fi

  rpm:
    needs: check
    uses: Open-Mixer/.github/.github/workflows/build-rpm.yml@openmixer-v1
    with:
      staged: ${{ inputs.staged == true }}
      staged-deps: ${{ inputs.staged-deps || '' }}
      package-name: omx-panel
      # omx-panel, and the renderer's shared library with its development files (each installed by the install checks)
      binary-names: omx-panel omx-panel-render omx-panel-render-devel
      publish: ${{ github.event_name == 'push' || inputs.publish == true }}
      republish: ${{ inputs.republish == true }}
      needs-mod-host: false
      # omx-contract-data and plugin-hostd-contract, which %check reads,
      # come from the channel
      channel-deps: true
    secrets: inherit

  # beside the RPMs: the two publish jobs share one concurrency group, so their pushes never race
  deb:
    needs: check
    uses: Open-Mixer/.github/.github/workflows/build-deb.yml@openmixer-v1
    with:
      staged: ${{ inputs.staged == true }}
      staged-deps: ${{ inputs.staged-deps || '' }}
      package-name: omx-panel
      binary-names: omx-panel libomx-panel-render0 libomx-panel-render-dev
      publish: ${{ github.event_name == 'push' || inputs.publish == true }}
      republish: ${{ inputs.republish == true }}
      dependencies: ''
      requires: ''
      # omx-contract-data and plugin-hostd-contract, which the tests read,
      # come from the channel
      channel-deps: true
    secrets: inherit

  pack:
    name: npm pack
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Pack the tarball the registry and the release both carry
        run: |
          mkdir -p pack
          npm pack --pack-destination pack
          tools/vendored-source.sh pack
          ls -l pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm-pack
          path: |
            pack/*.tgz
            pack/*-vendored.tar.gz
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/')) && 30 || 2 }}

  attach:
    name: Attach the npm tarball to the GitHub release
    needs: [pack, deb]
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.pack.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The release notes are the git history since the previous tag: no changelog file is kept (2026-10-09).
      - env:
          TAG: ${{ github.ref_name }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2>/dev/null || true)
          { echo "Changes in $TAG${prev:+ since $prev}:"; echo; git log --no-merges --format='- %s' "${prev:+$prev..}$TAG"; } > "$RUNNER_TEMP/release-notes.md"
      - uses: actions/download-artifact@v4
        with:
          name: npm-pack
          path: pack
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" pack/*.tgz pack/*-vendored.tar.gz --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" pack/*.tgz pack/*-vendored.tar.gz --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --repo "$GITHUB_REPOSITORY"
          fi
